services:
  mongo:
    image: mongo:7
    container_name: arooby-db
    restart: unless-stopped
    # Single-node replica set. Mongo only offers multi-document transactions on
    # a replica set, and the join-activity path needs them; a standalone mongod
    # would silently degrade that guarantee.
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '${DB_PORT:-27017}:27017'
    volumes:
      - arooby-db-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once the
      # node has been elected primary.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  arooby-db-data:
